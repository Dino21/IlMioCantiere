          { name: 'cantiereId', label: 'Cantiere', type: 'select', options: opCantieri, vuoto: '— nessuno —', help: 'Obbligatorio per le ore di lavoro' },
          { name: 'ore', label: 'Ore', type: 'number', step: '0.5', min: 0, max: 24, required: true },
          { name: 'oreStraordinario', label: 'Ore straordinario', type: 'number', step: '0.5', min: 0, max: 24 },
          { name: 'descrizione', label: 'Lavorazione / note', type: 'textarea', full: true },
        ],
        onMount(form) {
          const aggiorna = () => {
            const lavoro = form.elements.tipo.value === 'Lavoro';
            form.elements.oreStraordinario.disabled = !lavoro;
            if (!lavoro) form.elements.oreStraordinario.value = 0;
          };
          form.elements.tipo.addEventListener('change', aggiorna);
          aggiorna();
        },
        async salva(v) {
          v.cantiereId = v.cantiereId || null;
          v.oreStraordinario ??= 0;
          const res = r ? await modificaRegistrazione(r.id, v) : await nuovaRegistrazione(v);
          toast(r ? 'Registrazione aggiornata' : 'Registrazione salvata');
          dopo?.(res);
        },
        elimina: r ? async () => { await eliminaRegistrazione(r.id); toast('Registrazione eliminata'); dopo?.(); } : null,

      function benvenuto(el) {

    // ---------- Registro ore ----------
    const paginaRegistro = (() => {
      const stato = { data: oggiISO(), cantiereId: null, filtri: { operaioId: '', cantiereId: '', tipo: '' } };

      async function render(el, params) {
        if (params.cantiere) stato.cantiereId = params.cantiere;
        const [operai, cantieri, el2] = await Promise.all([elencoOperai(), elencoCantieri(), elenchi()]);
        const aperti = cantieri.filter((c) => c.stato !== 'Completato');
        if (!stato.cantiereId || !cantieri.some((c) => c.id === stato.cantiereId)) stato.cantiereId = aperti[0]?.id ?? null;

        el.innerHTML = `
          <div class="page-head">
            <div><h1>Registro ore</h1><p class="sub">Rapportino giornaliero per cantiere, assenze e storico delle registrazioni</p></div>
            <div class="actions"><button class="btn" id="singola">+ Assenza / registrazione singola</button>
              <button class="btn ghost solo-mobile solo-capo" data-esci>Esci</button></div>
          </div>

          <section class="card" id="rap">
            <div class="card-head"><h2>Rapportino giornaliero</h2><span class="hint" id="rapInfo"></span></div>
            ${aperti.length && operai.some((o) => o.attivo) ? `
            <div class="rap-head">
              <label class="f">Data<input type="date" id="rData" value="${stato.data}" max="${addDays(oggiISO(), 7)}"></label>
              <label class="f">Cantiere<select id="rCant">${cantieri.filter((c) => c.stato !== 'Completato' || c.id === stato.cantiereId)
                .map((c) => `<option value="${c.id}" ${c.id === stato.cantiereId ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select></label>
            </div>
            <label class="f" style="margin-bottom:14px">Lavorazioni eseguite (vale per tutti, se non scrivi una nota sulla riga)
              <input id="rDescr" placeholder="es. Getto solaio piano primo, posa ferri…"></label>
            <div id="rapTab"></div>
            <div class="rap-tools">
              <div class="actions">
                <button class="btn sm" id="tutti">Seleziona tutti</button>
                <button class="btn sm" id="nessuno">Nessuno</button>
                <button class="btn sm ghost" id="oreTutti">Imposta 8 h a tutti</button>
              </div>
              <div class="actions"><span class="rap-tot" id="rapTot"></span><button class="btn primary" id="salvaRap">Salva rapportino</button></div>
            </div>` : `<div class="empty">Per compilare il rapportino servono almeno un cantiere aperto e un operaio attivo.
                <br><br><a class="btn" href="#/cantieri">Vai ai cantieri</a> <a class="btn" href="#/operai">Vai agli operai</a></div>`}
          </section>

          <section class="card flush mt" id="storico">
            <div class="card-head"><h2>Registrazioni</h2>${periodoHTML()}</div>
            <div style="padding:14px 18px 0">
              <div class="filters">
                <label class="f">Operaio<select id="fOp"><option value="">Tutti</option>
                  ${operai.map((o) => `<option value="${o.id}">${esc(o.nomeCompleto)}</option>`).join('')}</select></label>
                <label class="f">Cantiere<select id="fCa"><option value="">Tutti</option>
                  ${cantieri.map((c) => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></label>
                <label class="f">Tipo<select id="fTi"><option value="">Tutti</option>
                  ${el2.tipiRegistro.map((t) => `<option>${esc(t)}</option>`).join('')}</select></label>
                <span class="spacer"></span>
                <button class="btn" id="csv" style="margin-bottom:1px">Esporta CSV</button>
              </div>
            </div>
            <div id="lista"></div>
          </section>`;

        // ----- rapportino -----
        if (el.querySelector('#rapTab')) {
          const caricaRap = () => rapportino(el, operai.filter((o) => o.attivo), cantieri, () => caricaLista());
          el.querySelector('#rData').addEventListener('change', (e) => { stato.data = e.target.value || oggiISO(); caricaRap(); });
          el.querySelector('#rCant').addEventListener('change', (e) => { stato.cantiereId = e.target.value; caricaRap(); });
          caricaRap();
        }

        // ----- storico -----
        const f = stato.filtri;
        el.querySelector('#fOp').value = f.operaioId;
        el.querySelector('#fCa').value = f.cantiereId;
        el.querySelector('#fTi').value = f.tipo;
        let righe = [];
        const caricaLista = async () => {
          const p = calcolaPeriodo();
          righe = await elencoOre({ ...p, ...f });
          const lavoro = righe.filter((r) => r.tipo === 'Lavoro');
          const lista = el.querySelector('#lista');
          lista.innerHTML = tabella([
            { t: 'Data', v: (r) => `${data(r.data)}` },
            { t: 'Operaio', v: (r) => (isAdmin() ? `<a class="link" href="#/operai/${r.operaioId}">${esc(r.operaio)}</a>` : esc(r.operaio)) },
            { t: 'Cantiere', v: (r) => (r.cantiere ? (isAdmin() ? `<a class="link" href="#/cantieri/${r.cantiereId}">${esc(r.cantiere)}</a> ` : esc(r.cantiere) + ' ') : '') + badgeTipo(r.tipo) },
            { t: 'Lavorazione', cls: 'wrap hide-sm', v: (r) => esc(r.descrizione ?? '') },
            { t: 'Ore', n: true, v: (r) => num(r.ore) },
            { t: 'Straord.', n: true, v: (r) => (r.oreStraordinario ? num(r.oreStraordinario) : '') },
            ...(isAdmin() ? [{ t: 'Costo', n: true, cls: 'hide-sm', v: (r) => (r.costo ? euro(r.costo) : '') }] : []),
          ], righe, {
            click: true,
            vuoto: 'Nessuna registrazione con questi filtri',
            piede: [`${righe.length} righe`, '', '', 'Ore lavorate', num(somma(lavoro, (r) => r.ore)), num(somma(lavoro, (r) => r.oreStraordinario)), euro(somma(righe, (r) => r.costo))].slice(0, isAdmin() ? 7 : 6),
          });
          collegaClick(lista, righe, (r) => formRegistro(r, ricaricaTutto));
        };
        const ricaricaTutto = () => render(el, {});
        const onFiltro = () => {
          f.operaioId = el.querySelector('#fOp').value;
          f.cantiereId = el.querySelector('#fCa').value;
          f.tipo = el.querySelector('#fTi').value;
          caricaLista();
        };
        ['#fOp', '#fCa', '#fTi'].forEach((s) => el.querySelector(s).addEventListener('change', onFiltro));
        collegaPeriodo(el.querySelector('#storico'), ricaricaTutto);
        el.querySelector('#singola').onclick = () => formRegistro(null, ricaricaTutto, { tipo: 'Ferie' });
        el.querySelector('#csv').onclick = () => scaricaCSV(`registro-ore.csv`, [
          ['Periodo', descriviPeriodo()], [],
          ['Data', 'Operaio', 'Tipo', 'Cantiere', 'Ore', 'Straordinario', 'Lavorazione', ...(isAdmin() ? ['Costo €'] : [])],
          ...righe.slice().reverse().map((r) => [data(r.data), r.operaio, r.tipo, r.cantiere ?? '', r.ore, r.oreStraordinario, r.descrizione ?? '', ...(isAdmin() ? [r.costo] : [])]),
        ]);
        await caricaLista();
      }

      // Disegna la tabella del rapportino per la data e il cantiere scelti
      async function rapportino(el, operaiAttivi, cantieri, dopoSalva) {
        const { data: giorno, cantiereId } = stato;
        const [delGiorno, precedenti] = await Promise.all([
          oreDelGiorno({ data: giorno }),
          elencoOre({ cantiereId, da: addDays(giorno, -14), a: addDays(giorno, -1), tipo: 'Lavoro' }),
        ]);
        const nomeCant = (id) => cantieri.find((c) => c.id === id)?.nome ?? '?';

        // righe già salvate per questo cantiere, e altre ore/assenze dello stesso giorno
        const qui = new Map(delGiorno.filter((r) => r.tipo === 'Lavoro' && r.cantiereId === cantiereId).map((r) => [r.operaioId, r]));
        const altrove = new Map();
        for (const r of delGiorno) {
          if (r.tipo === 'Lavoro' && r.cantiereId === cantiereId) continue;
          const testo = r.tipo === 'Lavoro' ? `${num(r.totale)} h su ${r.cantiere}` : `${r.tipo} ${num(r.totale)} h`;
          altrove.set(r.operaioId, [...(altrove.get(r.operaioId) ?? []), { testo, assenza: r.tipo !== 'Lavoro' }]);
        }

        // se il rapportino è nuovo, preseleziona la squadra dell'ultimo giorno lavorato su questo cantiere
        let squadra = new Set();
        let info = '';
        if (qui.size === 0 && precedenti.length) {
          const ultimo = precedenti[0].data;
          squadra = new Set(precedenti.filter((r) => r.data === ultimo).map((r) => r.operaioId));
          for (const id of altrove.keys()) if (altrove.get(id).some((x) => x.assenza)) squadra.delete(id);
          info = `Nuovo rapportino · preselezionata la squadra del ${data(ultimo)}`;
        } else if (qui.size) {
          info = `Rapportino già salvato: stai modificando ${qui.size} righe`;
        } else {
          info = 'Nuovo rapportino';
        }
        el.querySelector('#rapInfo').textContent = info;

        // ordina: prima chi è già sul rapportino o in squadra, poi gli altri
        const ordinati = [...operaiAttivi].sort((a, b) =>
          Number(qui.has(b.id) || squadra.has(b.id)) - Number(qui.has(a.id) || squadra.has(a.id)));

        const tab = el.querySelector('#rapTab');
        tab.innerHTML = `<div class="table-wrap"><table>
          <thead><tr><th style="width:36px"></th><th>Operaio</th><th class="n">Ore</th><th class="n">Straord.</th><th class="hide-sm">Nota (facoltativa)</th></tr></thead>
          <tbody>${ordinati.map((o) => {
            const r = qui.get(o.id);
            const on = !!r || squadra.has(o.id);
            const alt = altrove.get(o.id);
            return `<tr class="rap-row ${on ? '' : 'off'}" data-id="${o.id}">
              <td><input type="checkbox" class="sel" ${on ? 'checked' : ''} aria-label="Presente"></td>
              <td><b>${esc(o.nomeCompleto)}</b> <span class="muted">${esc(o.qualifica ?? '')}</span>
                ${alt ? `<span class="altro">${alt.map((x) => esc(x.testo)).join(' · ')}</span>` : ''}</td>
              <td class="n"><input class="h ore" type="number" inputmode="decimal" min="0" max="24" step="0.5" value="${r ? r.ore : 8}" ${on ? '' : 'disabled'}></td>
              <td class="n"><input class="h str" type="number" inputmode="decimal" min="0" max="24" step="0.5" value="${r ? r.oreStraordinario : 0}" ${on ? '' : 'disabled'}></td>
              <td class="hide-sm"><input class="d nota" value="${esc(r?.descrizione ?? '')}" ${on ? '' : 'disabled'}></td>
            </tr>`;
          }).join('')}</tbody></table></div>`;

        // la descrizione comune: se tutte le righe salvate hanno la stessa, la mostro sopra
        const descrizioni = [...new Set([...qui.values()].map((r) => r.descrizione ?? ''))];
        const descr = el.querySelector('#rDescr');
        descr.value = descrizioni.length === 1 ? descrizioni[0] : '';
        if (descrizioni.length === 1) tab.querySelectorAll('.nota').forEach((n) => { if (n.value === descr.value) n.value = ''; });

        const totale = () => {
          let h = 0, n = 0;
          tab.querySelectorAll('.rap-row').forEach((tr) => {
            if (!tr.querySelector('.sel').checked) return;
            n++;
            h += Number(tr.querySelector('.ore').value || 0) + Number(tr.querySelector('.str').value || 0);
          });
          el.querySelector('#rapTot').textContent = `${n} operai · ${ore(h)}`;
        };
        const imposta = (tr, on) => {
          tr.querySelector('.sel').checked = on;
          tr.classList.toggle('off', !on);
          tr.querySelectorAll('input:not(.sel)').forEach((i) => { i.disabled = !on; });
        };
        tab.querySelectorAll('.rap-row').forEach((tr) => {
          tr.querySelector('.sel').addEventListener('change', (e) => { imposta(tr, e.target.checked); totale(); });
          tr.querySelectorAll('.ore,.str').forEach((i) => i.addEventListener('input', totale));
        });
        el.querySelector('#tutti').onclick = () => { tab.querySelectorAll('.rap-row').forEach((tr) => imposta(tr, true)); totale(); };
        el.querySelector('#nessuno').onclick = () => { tab.querySelectorAll('.rap-row').forEach((tr) => imposta(tr, false)); totale(); };
        el.querySelector('#oreTutti').onclick = () => {
          tab.querySelectorAll('.rap-row').forEach((tr) => { if (tr.querySelector('.sel').checked) tr.querySelector('.ore').value = 8; });
          totale();
        };
        totale();

        el.querySelector('#salvaRap').onclick = async (e) => {
          const righe = [];
          tab.querySelectorAll('.rap-row').forEach((tr) => {
            const id = tr.dataset.id;
            const on = tr.querySelector('.sel').checked;
            if (!on && !qui.has(id)) return; // niente da fare
            righe.push({
              operaioId: id,
              ore: on ? Number(tr.querySelector('.ore').value || 0) : 0,
              oreStraordinario: on ? Number(tr.querySelector('.str').value || 0) : 0,
              descrizione: tr.querySelector('.nota').value.trim() || descr.value.trim() || null,
            });
          });
          if (!righe.length) return toast('Seleziona almeno un operaio', 'err');
          e.target.disabled = true;
          try {
            const r = await salvaRapportino({ data: giorno, cantiereId, righe });
            toast(`Rapportino salvato: ${r.salvate} righe${r.eliminate ? `, ${r.eliminate} rimosse` : ''} · ${nomeCant(cantiereId)}, ${dataLunga(giorno)}`);
            await rapportino(el, operaiAttivi, cantieri, dopoSalva);
            dopoSalva();
          } catch (ex) {
            toast(ex.message, 'err');
          } finally {
            e.target.disabled = false;
          }
        };
      }
      return render;
    })();

    // ---------- Cantieri ----------
    const paginaCantieri = (() => {
      let filtroStato = 'attivi';

    // ---------- Report ----------
    const paginaReport = (() => {
      let scheda = 'matrice';
      const oggi = new Date();
      let meseSel = `${oggi.getFullYear()}-${String(oggi.getMonth() + 1).padStart(2, '0')}`;

      const CODICI = { Ferie: 'F', Permesso: 'P', Malattia: 'M', Infortunio: 'I', Maltempo: 'MT', Altro: 'A' };

      async function render(el) {
        el.innerHTML = `
          <div class="page-head">
            <div><h1>Report</h1><p class="sub">Riepiloghi da esportare in Excel o stampare</p></div>
            <div class="actions"><button class="btn" id="stampa">Stampa</button><button class="btn primary" id="csv">Esporta CSV</button></div>
          </div>
          <div class="tabs" role="tablist">
            <button data-s="matrice">Ore operaio × cantiere</button>
            <button data-s="presenze">Foglio presenze mensile</button>
            <button data-s="costi">Costi per cantiere</button>
          </div>
          <div id="corpo"><div class="loading">Caricamento…</div></div>`;

        el.querySelectorAll('.tabs button').forEach((b) => {
          b.classList.toggle('on', b.dataset.s === scheda);
          b.onclick = () => { scheda = b.dataset.s; render(el); };
        });
        el.querySelector('#stampa').onclick = () => window.print();

        const corpo = el.querySelector('#corpo');
        const ricarica = () => render(el);
        let esporta;
        if (scheda === 'matrice') esporta = await matrice(corpo, ricarica);
        else if (scheda === 'presenze') esporta = await presenze(corpo, ricarica);
        else esporta = await costi(corpo, ricarica);
        el.querySelector('#csv').onclick = esporta;
      }

      // ---------- Operai x Cantieri ----------
      async function matrice(el, ricarica) {
        const m = await reportMatrice(calcolaPeriodo());
        el.innerHTML = `
          <div class="filters">${periodoHTML()}</div>
          <h2 class="print-title">Ore per operaio e cantiere — ${esc(descriviPeriodo())}</h2>
          <section class="card flush">
            <div class="card-head"><h2>Ore lavorate <span class="muted" style="font-weight:500">${esc(descriviPeriodo())}</span></h2>
              <span class="hint">ordinarie + straordinarie · costo totale ${euro0(m.costo)}</span></div>
            ${m.righe.length ? `<div class="table-wrap"><table>
              <thead><tr><th>Operaio</th>${m.cantieri.map((c) => `<th class="n" title="${esc(c.nome)}">${esc(c.nome.length > 22 ? c.nome.slice(0, 20) + '…' : c.nome)}</th>`).join('')}
                <th class="n">di cui straord.</th><th class="n">Totale</th></tr></thead>
              <tbody>${m.righe.map((r) => `<tr><td><a class="link" href="#/operai/${r.operaioId}">${esc(r.operaio)}</a></td>
                ${m.cantieri.map((c) => `<td class="n">${r.celle[c.id] ? num(r.celle[c.id]) : '<span class="muted">·</span>'}</td>`).join('')}
                <td class="n muted">${r.straordinario ? num(r.straordinario) : ''}</td>
                <td class="n"><b>${num(r.totale)}</b></td></tr>`).join('')}</tbody>
              <tfoot><tr><td>Totale</td>${m.cantieri.map((c) => `<td class="n">${num(m.totaliColonne[c.id])}</td>`).join('')}
                <td class="n">${num(somma(m.righe, (r) => r.straordinario))}</td><td class="n">${num(m.totale)}</td></tr></tfoot>
            </table></div>` : '<div class="empty">Nessuna ora nel periodo</div>'}
          </section>`;

          ['Periodo', descriviPeriodo()], [],
          ['Operaio', ...m.cantieri.map((c) => c.nome), 'di cui straordinario', 'Totale ore', 'Costo €'],
          ...m.righe.map((r) => [r.operaio, ...m.cantieri.map((c) => r.celle[c.id] ?? 0), r.straordinario, r.totale, r.costo]),
          ['TOTALE', ...m.cantieri.map((c) => m.totaliColonne[c.id]), somma(m.righe, (r) => r.straordinario), m.totale, m.costo],
        ]);
      }

      // ---------- Foglio presenze ----------
      async function presenze(el, ricarica) {
        const [anno, mese] = meseSel.split('-').map(Number);
        const f = await reportMensile({ anno, mese });
        const giorni = Array.from({ length: f.giorniNelMese }, (_, i) => i + 1);
        const weekend = (g) => [0, 6].includes(new Date(anno, mese - 1, g).getDay());
        const iniz = (g) => new Date(anno, mese - 1, g).toLocaleDateString('it-IT', { weekday: 'narrow' });
        const tipiAss = [...new Set(f.righe.flatMap((r) => Object.keys(r.assenze)))];

        const cella = (g) => {
          if (!g) return '';
          const parti = [];
          if (g.ore) parti.push(num(g.ore));
          if (g.straordinario) parti.push(`<span class="str">+${num(g.straordinario)}</span>`);
          for (const a of g.assenze) parti.push(`<span class="cell-ass ${esc(a.tipo)}">${CODICI[a.tipo] ?? '?'}</span>`);
          return parti.join(' ');
        };
        const titoloCella = (r, d, g) => g ? `${r.operaio} – ${d}/${mese}: ${[
          g.ore ? `${num(g.ore)} h` : '', g.straordinario ? `+${num(g.straordinario)} straord.` : '',
          ...g.assenze.map((a) => `${a.tipo} ${num(a.ore)} h`), g.cantieri.join(', ')].filter(Boolean).join(' · ')}` : '';

        el.innerHTML = `
          <div class="filters"><label class="f">Mese<input type="month" id="mese" value="${meseSel}"></label></div>
          <h2 class="print-title">Foglio presenze — ${esc(nomeMeseLungo(anno, mese))}</h2>
          <section class="card flush">
            <div class="card-head"><h2 style="text-transform:capitalize">${esc(nomeMeseLungo(anno, mese))}</h2><span class="hint">passa sopra una cella per i dettagli</span></div>
            <div class="table-wrap"><table class="sheet">
              <thead><tr><th class="name">Operaio</th>
                ${giorni.map((g) => `<th class="${weekend(g) ? 'we' : ''}">${iniz(g)}<br>${g}</th>`).join('')}
                <th>Ore</th><th>Str.</th><th>gg lav.</th>${tipiAss.map((t) => `<th title="${esc(t)}">${CODICI[t] ?? t}</th>`).join('')}</tr></thead>
              <tbody>${f.righe.map((r) => `<tr><td class="name"><a class="link" href="#/operai/${r.operaioId}">${esc(r.operaio)}</a></td>
                ${giorni.map((g) => `<td class="${weekend(g) ? 'we' : ''}" title="${esc(titoloCella(r, g, r.giorni[g]))}">${cella(r.giorni[g])}</td>`).join('')}
                <td><b>${num(r.ore)}</b></td><td>${r.straordinario ? num(r.straordinario) : ''}</td><td>${r.giorniLavorati}</td>
                ${tipiAss.map((t) => `<td>${r.assenze[t] ? r.assenze[t].giorni : ''}</td>`).join('')}</tr>`).join('')}</tbody>
            </table></div>
          </section>
          <div class="legend"><span><b>8</b> ore ordinarie</span><span><b class="str">+2</b> straordinario</span>
            ${Object.entries(CODICI).map(([t, c]) => `<span><b>${c}</b> ${t}</span>`).join('')}
            <span>Nelle colonne finali: giorni di assenza per tipo</span></div>`;

        el.querySelector('#mese').onchange = (e) => { if (e.target.value) { meseSel = e.target.value; ricarica(); } };

        return () => scaricaCSV(`presenze-${meseSel}.csv`, [
          ['Foglio presenze', nomeMeseLungo(anno, mese)], [],
          ['Operaio', 'Qualifica', ...giorni.map(String), 'Ore ordinarie', 'Straordinario', 'Giorni lavorati', ...tipiAss.map((t) => `Giorni ${t}`)],
          ...f.righe.map((r) => [r.operaio, r.qualifica ?? '', ...giorni.map((g) => {
            const x = r.giorni[g];
            if (!x) return '';
            return [x.ore ? num(x.ore) : '', x.straordinario ? '+' + num(x.straordinario) : '', ...x.assenze.map((a) => CODICI[a.tipo] ?? a.tipo)].filter(Boolean).join(' ');
          }), r.ore, r.straordinario, r.giorniLavorati, ...tipiAss.map((t) => r.assenze[t]?.giorni ?? 0)]),
        ]);
      }

      // ---------- Costi per cantiere ----------
      async function costi(el, ricarica) {
        const righe = await reportCosti(calcolaPeriodo());
        const categorie = [...new Set(righe.flatMap((r) => Object.keys(r.spesePerCategoria)))].sort();
        const tot = (f) => somma(righe, f);

        el.innerHTML = `
          <div class="filters">${periodoHTML()}</div>
          <h2 class="print-title">Costi per cantiere — ${esc(descriviPeriodo())}</h2>
          <section class="kpis">
            <div class="kpi accent"><div class="lbl">Costo totale</div><div class="val">${euro0(tot((r) => r.costoTotale))}</div><div class="foot">${esc(descriviPeriodo())}</div></div>
            <div class="kpi"><div class="lbl">Manodopera</div><div class="val">${euro0(tot((r) => r.costoManodopera))}</div><div class="foot">${num(tot((r) => r.ore))} ore</div></div>
            <div class="kpi"><div class="lbl">Spese</div><div class="val">${euro0(tot((r) => r.spese))}</div><div class="foot">${categorie.length} categorie</div></div>
          </section>
          <section class="card flush">
            ${righe.length ? `<div class="table-wrap"><table>
              <thead><tr><th>Cantiere</th><th class="n">Ore</th><th class="n">Manodopera</th>
                ${categorie.map((c) => `<th class="n hide-sm">${esc(c)}</th>`).join('')}
                <th class="n">Totale</th><th>Budget (costi totali)</th></tr></thead>
              <tbody>${righe.map((r) => `<tr>
                <td><a class="link" href="#/cantieri/${r.id}">${esc(r.nome)}</a> ${r.stato !== 'In corso' ? badgeStato(r.stato) : ''}</td>
                <td class="n">${num(r.ore)}</td><td class="n">${euro0(r.costoManodopera)}</td>
                ${categorie.map((c) => `<td class="n hide-sm">${r.spesePerCategoria[c] ? euro0(r.spesePerCategoria[c]) : '<span class="muted">·</span>'}</td>`).join('')}
                <td class="n"><b>${euro0(r.costoTotale)}</b></td>
                <td>${r.budget ? progresso(r.costoTotale, r.budget) : '<span class="muted">—</span>'}</td></tr>`).join('')}</tbody>
              <tfoot><tr><td>Totale</td><td class="n">${num(tot((r) => r.ore))}</td><td class="n">${euro0(tot((r) => r.costoManodopera))}</td>
                ${categorie.map((c) => `<td class="n hide-sm">${euro0(tot((r) => r.spesePerCategoria[c]))}</td>`).join('')}
                <td class="n">${euro0(tot((r) => r.costoTotale))}</td><td></td></tr></tfoot>
            </table></div>
            <p class="muted" style="padding:0 18px 14px;font-size:13px">La barra del budget confronta i costi del periodo selezionato con il budget complessivo: scegli “Tutto” per vedere l’avanzamento reale.</p>`
              : '<div class="empty">Nessun costo nel periodo</div>'}
          </section>`;
        collegaPeriodo(el, ricarica);

        return () => scaricaCSV('costi-cantieri.csv', [
          ['Periodo', descriviPeriodo()], [],
          ['Cantiere', 'Stato', 'Ore', 'Manodopera €', ...categorie.map((c) => `${c} €`), 'Spese totali €', 'Costo totale €', 'Budget €'],
          ...righe.map((r) => [r.nome, r.stato, r.ore, r.costoManodopera, ...categorie.map((c) => r.spesePerCategoria[c] ?? 0), r.spese, r.costoTotale, r.budget ?? '']),
        ]);
      }
      return render;
    })();

    // ---------- Impostazioni: utenti e backup (solo amministratore) ----------
    const paginaImpostazioni = (() => {
      const RUOLI = [
        { value: 'caposquadra', label: 'Caposquadra — compila rapportini e assenze' },
        { value: 'admin', label: 'Amministratore — vede e modifica tutto' },
      ];

      async function render(el) {
        let utenti;
        try { utenti = await leggiCollezione('utenti'); }
        catch (e) { throw new Error(messaggioErrore(e)); }
        utenti.sort((a, b) => confronta(a.nome, b.nome));
        const n = info().conteggi;
        const ricarica = () => render(el);

        el.innerHTML = `
          <div class="page-head">
            <div><h1>Impostazioni</h1><p class="sub">Utenti e backup</p></div>
            <div class="actions"><button class="btn ghost solo-mobile" data-esci>Esci</button></div>
          </div>
          <section class="card flush" id="lista">
            <div class="card-head"><h2>Utenti</h2><button class="btn sm primary" id="nuovo">+ Nuovo utente</button></div>
            ${tabella([
              { t: 'Nome', v: (u) => `<b>${esc(u.nome ?? '')}</b>${u.id === dati.utente.uid ? ' <span class="badge acc">Tu</span>' : ''}` },
              { t: 'Email', v: (u) => esc(u.email ?? '') },
              { t: 'Ruolo', v: (u) => `<span class="badge ${u.ruolo === 'admin' ? 'info' : ''}">${u.ruolo === 'admin' ? 'Amministratore' : 'Caposquadra'}</span>` },
              { t: 'Stato', v: (u) => (u.attivo ? '<span class="badge ok">Attivo</span>' : '<span class="badge bad">Disattivato</span>') },
            ], utenti, { click: true, vuoto: 'Nessun utente' })}
            <p class="muted" style="padding:0 18px 14px;font-size:13px;margin:0">Il caposquadra vede solo il Registro ore (senza costi).
              Per togliere l'accesso a qualcuno, disattivalo. La password la può cambiare con “Password dimenticata?” nella pagina di accesso.</p>
          </section>
          <section class="card mt">
            <div class="card-head"><h2>Backup</h2></div>
            <p style="margin-top:0">In archivio: ${n.operai} operai, ${n.cantieri} cantieri, ${num(n.ore)} registrazioni ore, ${n.spese} spese, ${n.scadenze} documenti.
              Scarica ogni tanto una copia completa (file .json) e conservala sul PC.</p>
            <button class="btn" id="backup">Scarica backup</button>
          </section>`;

        el.querySelector('#nuovo').onclick = () => formModal({
          titolo: 'Nuovo utente',
          valori: { ruolo: 'caposquadra' },
          campi: [
            { name: 'nome', label: 'Nome e cognome', required: true, full: true },
            { name: 'email', label: 'Email', type: 'email', required: true, full: true },
            { name: 'password', label: 'Password provvisoria', required: true, help: 'Almeno 6 caratteri' },
            { name: 'ruolo', label: 'Ruolo', type: 'select', options: RUOLI },
          ],
          async salva(v) {
            if (v.password.length < 6) throw new Error('La password deve avere almeno 6 caratteri.');
            try {
              const uid = await creaAccount(v.email, v.password);
              await scriviFirestore([{ tipo: 'set', coll: 'utenti', id: uid, dati: { nome: v.nome, email: v.email, ruolo: v.ruolo, attivo: true, creatoIl: new Date().toISOString() } }]);
            } catch (e) { throw new Error(messaggioErrore(e)); }
            toast(`Utente creato: ${v.email}`);
            ricarica();
          },
        });

        collegaClick(el.querySelector('#lista'), utenti, (u) => formModal({
          titolo: 'Modifica utente',
          valori: u,
          campi: [
            { name: 'nome', label: 'Nome e cognome', required: true, full: true },
            { name: 'ruolo', label: 'Ruolo', type: 'select', options: RUOLI, full: true },
            { name: 'attivo', label: 'Account attivo (può accedere)', type: 'checkbox', full: true },
          ],
          async salva(v) {
            if (u.id === dati.utente.uid && (v.ruolo !== 'admin' || !v.attivo)) {
              throw new Error('Non puoi togliere a te stesso il ruolo di amministratore o disattivarti.');
            }
            try { await scriviFirestore([{ tipo: 'merge', coll: 'utenti', id: u.id, dati: { nome: v.nome, ruolo: v.ruolo, attivo: v.attivo } }]); }
            catch (e) { throw new Error(messaggioErrore(e)); }
            toast('Utente aggiornato');
            ricarica();
          },
        }));

        el.querySelector('#backup').onclick = () => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([JSON.stringify(esporta(), null, 1)], { type: 'application/json' }));
          a.download = `cantiere-backup-${oggiISO()}.json`;
          document.body.append(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        };
      }
      return render;
    })();

    function schermata(html) {
      document.querySelector('.shell').hidden = true;
      const b = document.getElementById('accesso');
      b.hidden = false;
      b.innerHTML = `<div class="login-card">
        <div class="login-brand"><span class="brand-mark"><svg viewBox="0 0 32 32"><path d="M6 22h20v3H6zM9 13l7-6 7 6v8h-4v-5h-6v5H9z"/></svg></span>
          <span>Il Mio Cantiere</span></div>${html}</div>`;

    }

    function nascondiSchermata() {
      document.getElementById('accesso').hidden = true;
      document.querySelector('.shell').hidden = false;
    }

    function schermataAccesso() {
      const b = schermata(`
        <h1>Accedi</h1>
        <form class="stack" novalidate>
          <label class="f">Email<input name="email" type="email" autocomplete="username" required></label>
          <label class="f">Password<input name="password" type="password" autocomplete="current-password" required></label>
          <p class="form-err" hidden></p>
          <button class="btn primary" type="submit">Entra</button>
          <button class="btn ghost" type="button" id="recupera">Password dimenticata?</button>
        </form>`);
      const f = b.querySelector('form');
      const err = f.querySelector('.form-err');
      const errore = (m) => { err.textContent = m; err.hidden = false; };
      f.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.hidden = true;
        try { await signInWithEmailAndPassword(auth, f.email.value.trim(), f.password.value); }
        catch (ex) { errore(messaggioErrore(ex)); }
      });
      b.querySelector('#recupera').onclick = async () => {
        const email = f.email.value.trim();
        if (!email) return errore('Scrivi la tua email, poi premi di nuovo "Password dimenticata?".');
        try { await sendPasswordResetEmail(auth, email); toast('Ti abbiamo inviato un’email per reimpostare la password'); }
        catch (ex) { errore(messaggioErrore(ex)); }
      };
      setTimeout(() => f.email.focus(), 50);
    }

    // Primo avvio: non esiste ancora un amministratore, chi è entrato può diventarlo
    function schermataPrimoAvvio(u) {
      const b = schermata(`
        <h1>Prima configurazione</h1>
        <p class="muted">Sei il primo utente: diventerai <b>amministratore</b> e potrai creare gli account per i capisquadra.</p>
        <form class="stack" novalidate>
          <label class="f">Il tuo nome<input name="nome" required></label>
          <p class="form-err" hidden></p>
          <button class="btn primary" type="submit">Diventa amministratore</button>
          <button class="btn ghost" type="button" data-esci>Esci (${esc(u.email)})</button>
        </form>`);
      const f = b.querySelector('form');
      f.addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = f.querySelector('.form-err');
        const nome = f.nome.value.trim();
        if (!nome) { err.textContent = 'Scrivi il tuo nome'; err.hidden = false; return; }
        try {
          const ora = new Date().toISOString();
          await scriviFirestore([
            { tipo: 'set', coll: 'utenti', id: u.uid, dati: { nome, email: u.email, ruolo: 'admin', attivo: true, creatoIl: ora } },
            { tipo: 'set', coll: 'config', id: 'impostazioni', dati: { creatoIl: ora, creatoDa: u.email } },
          ]);
          dopoAccesso(u);
        } catch (ex) { err.textContent = messaggioErrore(ex); err.hidden = false; }
      });
    }

    function schermataNonAbilitato(u, motivo) {
      schermata(`
        <h1>Accesso non abilitato</h1>
        <p>${esc(motivo)}</p>
        <p class="muted">Account: ${esc(u.email)}</p>
        <div class="actions"><button class="btn" onclick="location.reload()">Riprova</button><button class="btn ghost" data-esci>Esci</button></div>`);
    }

    // =====================================================================
    //  AVVIO E NAVIGAZIONE  (indirizzi tipo #/cantieri/abc123)
    // =====================================================================
    const app = document.getElementById('app');

    const rotte = {                     // admin: true = solo amministratore
      '': { render: paginaPanoramica, admin: true },
      ore: { render: paginaRegistro },
      cantieri: { render: paginaCantieri, admin: true },
      operai: { render: paginaOperai, admin: true },
      spese: { render: paginaSpese, admin: true },
      report: { render: paginaReport, admin: true },
      impostazioni: { render: paginaImpostazioni, admin: true },
    };

    async function naviga() {
      if (!dati.utente) return;
      const [percorso, query] = location.hash.replace(/^#\/?/, '').split('?');
      const [sezione, id] = percorso.split('/');
      const params = Object.fromEntries(new URLSearchParams(query || ''));
      if (id) params.id = decodeURIComponent(id);

      const rotta = rotte[sezione || ''];
      if (!rotta) { app.innerHTML = '<div class="empty">Pagina non trovata</div>'; return; }
      if (rotta.admin && !isAdmin()) { location.hash = '#/ore'; return; }

      document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('active', a.dataset.r === (sezione || '')));
      try {
        await rotta.render(app, params);
      } catch (e) {
        console.error(e);
        app.innerHTML = `<div class="card"><h2>Si è verificato un problema</h2><p class="muted">${esc(e.message)}</p>
          <button class="btn" onclick="location.reload()">Ricarica</button></div>`;
      }
    }

    async function dopoAccesso(u) {
      app.innerHTML = '<div class="loading">Caricamento dati…</div>';
      let profilo;
      try { profilo = await leggiDoc('utenti', u.uid); }
      catch (e) { return schermataNonAbilitato(u, 'Impossibile leggere il profilo: ' + messaggioErrore(e)); }

      if (!profilo) {
        let setup = null;
        try { setup = await leggiDoc('config', 'impostazioni'); } catch { /* nessun permesso o offline */ }
        if (!setup) return schermataPrimoAvvio(u);
        return schermataNonAbilitato(u, "Il tuo account non è ancora abilitato: chiedi all'amministratore di aggiungerti in Impostazioni.");
      }
      if (!profilo.attivo) return schermataNonAbilitato(u, "Il tuo account è stato disattivato. Contatta l'amministratore.");

      dati.utente = { uid: u.uid, email: u.email, nome: profilo.nome, ruolo: profilo.ruolo };
      nascondiSchermata();
      document.body.classList.toggle('ruolo-caposquadra', !isAdmin());
      document.getElementById('chiSono').innerHTML = `<b>${esc(profilo.nome || u.email)}</b><span>${isAdmin() ? 'Amministratore' : 'Caposquadra'}</span>`;
      try {
        await avviaDati();
      } catch (e) {
        app.innerHTML = `<div class="card"><h2>Impossibile caricare i dati</h2><p class="muted">${esc(messaggioErrore(e))}</p>
          <button class="btn" onclick="location.reload()">Riprova</button></div>`;
        return;
      }
      if (!isAdmin() && !location.hash.startsWith('#/ore')) location.hash = '#/ore';
      else naviga();
    }

    onAuthStateChanged(auth, (u) => {
      if (u) return dopoAccesso(u);
      fermaDati();
      dati.utente = null;
      schermataAccesso();
    });

    document.addEventListener('click', (e) => { if (e.target.closest('[data-esci]')) signOut(auth); });
    window.addEventListener('ricarica', naviga);
    checkUpdate();
    window.addEventListener('hashchange', () => { naviga(); window.scrollTo(0, 0); });
    // dati cambiati da un altro dispositivo: ridisegno, ma non mentre si compila qualcosa
    window.addEventListener('dati-aggiornati', () => {
      if (!document.querySelector('dialog[open]') && !location.hash.startsWith('#/ore')) naviga();
    });

  </script>
</body>
</html>
